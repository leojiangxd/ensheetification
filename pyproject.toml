[project]
name = "ensheetify"
version = "0.1.0"
description = "Turn any song into a piano arrangement you can actually play."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "basic-pitch[onnx]",
    "librosa",
    "soundfile",
    "music21",
    "verovio",
    "svglib",
    "reportlab",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.34",
    "yt-dlp>=2026.11.23",
]

[project.scripts]
ensheet = "ensheet.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ensheet", "api"]

[tool.uv]
# basic-pitch pulls tensorflow on Windows; 0.31.0 is the last tf-io-gcs release with Windows wheels
constraint-dependencies = ["tensorflow-io-gcs-filesystem<=0.31.0; sys_platform == 'win32'"]
